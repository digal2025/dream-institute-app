version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - zoho-invoice-api/.env
    volumes:
      # Mount env file for easy configuration updates
      - ./zoho-invoice-api/.env:/app/zoho-invoice-api/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  # Optional: Add MongoDB service for local development
  # mongodb:
  #   image: mongo:6
  #   container_name: dream-institute-db
  #   restart: unless-stopped
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: admin
  #     MONGO_INITDB_ROOT_PASSWORD: password
  #   volumes:
  #     - mongodb_data:/data/db
  #   ports:
  #     - "27017:27017"
  #   networks:
  #     - app-network

# volumes:
#   mongodb_data:

networks:
  app-network:
    driver: bridge